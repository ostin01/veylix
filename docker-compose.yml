services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bootstrap:
    build: .
    command: ["python", "-m", "auth.bootstrap"]
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER}
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?Configure BOOTSTRAP_ADMIN_USERNAME}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Configure BOOTSTRAP_ADMIN_PASSWORD}
    secrets:
      - jwt_secret_key
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER}
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
    ports:
      - "8000:8000"
    secrets:
      - jwt_secret_key
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  telemetry-consumer:
    build: .
    command: ["python", "-m", "telemetry.consumer"]
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER}
      MQTT_HOST: mqtt
      MQTT_PORT: 8883
      MQTT_USERNAME: veylix-consumer
      MQTT_PASSWORD_FILE: /run/secrets/mqtt_consumer_password
      MQTT_TLS_CA_CERT: /run/secrets/mqtt_ca_cert
      TELEMETRY_MAX_ATTEMPTS: ${TELEMETRY_MAX_ATTEMPTS:-5}
      DEVICE_OFFLINE_AFTER_SECONDS: ${DEVICE_OFFLINE_AFTER_SECONDS:-60}
      DEVICE_OFFLINE_CHECK_INTERVAL_SECONDS: ${DEVICE_OFFLINE_CHECK_INTERVAL_SECONDS:-10}
    secrets:
      - mqtt_consumer_password
      - mqtt_ca_cert
    depends_on:
      migrate:
        condition: service_completed_successfully
      mqtt:
        condition: service_healthy
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    command:
      - /bin/sh
      - -ec
      - |
        simulator_password="$$(cat /run/secrets/mqtt_simulator_password)"
        consumer_password="$$(cat /run/secrets/mqtt_consumer_password)"
        printf '%s\n%s\n' "$$simulator_password" "$$simulator_password" | mosquitto_passwd -c /mosquitto/data/passwordfile veylix-simulator
        printf '%s\n%s\n' "$$consumer_password" "$$consumer_password" | mosquitto_passwd /mosquitto/data/passwordfile veylix-consumer
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "127.0.0.1:8883:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - mqtt_data:/mosquitto/data
    secrets:
      - mqtt_simulator_password
      - mqtt_consumer_password
      - mqtt_ca_cert
      - mqtt_server_cert
      - mqtt_server_key
    healthcheck:
      test:
        - CMD-SHELL
        - "mosquitto_pub -h 127.0.0.1 -p 8883 --cafile /run/secrets/mqtt_ca_cert -u veylix-simulator -P \"$$(cat /run/secrets/mqtt_simulator_password)\" -t healthcheck -m ok"
      interval: 10s
      timeout: 5s
      retries: 5

  simulator:
    build:
      context: .
      dockerfile: vehicle-simulator/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER}
      MQTT_HOST: mqtt
      MQTT_PORT: 8883
      MQTT_USERNAME: veylix-simulator
      MQTT_PASSWORD_FILE: /run/secrets/mqtt_simulator_password
      MQTT_TLS_CA_CERT: /run/secrets/mqtt_ca_cert
      SIMULATOR_PUBLISH_INTERVAL_SECONDS: 5
      SIMULATOR_RANDOM_SEED: 42
    secrets:
      - mqtt_simulator_password
      - mqtt_ca_cert
    depends_on:
      mqtt:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      telemetry-consumer:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  mqtt_data:

secrets:
  jwt_secret_key:
    file: ${JWT_SECRET_KEY_FILE:?Set JWT_SECRET_KEY_FILE}
  mqtt_simulator_password:
    file: ${MQTT_SIMULATOR_PASSWORD_FILE:-./secrets/mqtt/simulator_password}
  mqtt_consumer_password:
    file: ${MQTT_CONSUMER_PASSWORD_FILE:-./secrets/mqtt/consumer_password}
  mqtt_ca_cert:
    file: ${MQTT_CA_CERT_FILE:-./secrets/mqtt/ca.crt}
  mqtt_server_cert:
    file: ${MQTT_SERVER_CERT_FILE:-./secrets/mqtt/server.crt}
  mqtt_server_key:
    file: ${MQTT_SERVER_KEY_FILE:-./secrets/mqtt/server.key}
