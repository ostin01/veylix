services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: veylix
      POSTGRES_USER: veylix
      POSTGRES_PASSWORD: veylix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veylix -d veylix"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://veylix:veylix@postgres:5432/veylix
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://veylix:veylix@postgres:5432/veylix
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  telemetry-consumer:
    build: .
    command: ["python", "-m", "telemetry.consumer"]
    environment:
      DATABASE_URL: postgresql+psycopg://veylix:veylix@postgres:5432/veylix
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
    depends_on:
      migrate:
        condition: service_completed_successfully
      mqtt:
        condition: service_healthy
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
    healthcheck:
      test:
        - CMD-SHELL
        - "mosquitto_pub -h 127.0.0.1 -t healthcheck -m ok"
      interval: 10s
      timeout: 5s
      retries: 5

  simulator:
    build:
      context: .
      dockerfile: vehicle-simulator/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://veylix:veylix@postgres:5432/veylix
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      SIMULATOR_PUBLISH_INTERVAL_SECONDS: 5
      SIMULATOR_RANDOM_SEED: 42
    depends_on:
      mqtt:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      telemetry-consumer:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  mqtt_data:
