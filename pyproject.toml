[project]
name = "veylix"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Austin", email = "austinpaul606@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15.0",
    "fastapi[standard]>=0.162.2",
    "paho-mqtt>=2.1.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.38",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
]

[project.scripts]
veylix = "veylix:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]